<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js" defer></script>
    <title>Private Vault</title>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div id="loading-overlay"><div class="loading-spinner"></div></div>
    
    <div class="page-wrap">
        <div id="main-content" style="display: none;"></div>
        <footer>&copy; 2026 Salmontol</footer>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        if(canvas) {
            const renderer = new THREE.WebGLRenderer({canvas, alpha:true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 5;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(800 * 3);
            for(let i=0; i<800*3; i++) pos[i] = (Math.random()-0.5)*100;
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const stars = new THREE.Points(geo, new THREE.PointsMaterial({color: 0xef4444, size: 0.1, transparent: true, opacity: 0.4}));
            scene.add(stars);
            function animate() {
                requestAnimationFrame(animate);
                stars.rotation.y += 0.001;
                renderer.render(scene, camera);
            }
            animate();
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
